name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch>=2.0
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Claim reproducibility gate
        # The unit suite already runs tests/test_claims_are_reproducible.py, which executes
        # these scripts and compares their output to the README. This step adds the part a
        # test cannot do on a dirty tree: prove the *committed* results/ files are what the
        # code produces. Before this, the step re-ran the script and overwrote the JSON
        # without ever diffing, so a stale artifact passed forever.
        run: |
          python scripts/regen_int8_collapse.py
          python scripts/regen_quiet_model.py
          if ! git diff --quiet -- results/; then
            echo "::error::results/ changed when regenerated — commit the regenerated files so the README's auditable artifact matches the code"
            git diff --stat -- results/
            exit 1
          fi
