name: Release to PyPI

on:
  release:
    types: [published]

# Only a VERSION release (vX.Y.Z) publishes to PyPI.
#
# `v1` is the Action pin the README tells users to use, and it is a MOVING tag --
# it tracks the release line rather than naming a version. Publishing on it meant
# every re-point of `v1` re-ran this workflow and tried to upload whatever version
# pyproject.toml happened to declare. Observed: moving `v1` to a commit whose
# pyproject said 0.1.1 produced
#   400 File already exists ('quant-regress-0.1.1-py3-none-any.whl')
# because 0.1.1 was already on PyPI and filenames are immutable. Harmless (nothing
# was overwritten) but it puts a permanently red run on the repo and trains people
# to ignore it.
#
# The guard below makes the distinction explicit: a version tag matches ^v\d+\.\d+\.\d+$,
# so `v0.1.1` publishes and `v1` does not.

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    # Skip the Action-pin tag. `if` must be on the job, not the trigger: the
    # `on: release` filter cannot see github.event.release.tag_name.
    if: ${{ github.event.release.tag_name =~ '^v[0-9]+\.[0-9]+\.[0-9]+$' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quant-regress
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate artifacts
        run: python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
