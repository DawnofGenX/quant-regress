[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-regress"
version = "1.0.2"
description = "Fail CI when quantization costs you task accuracy. Task-level regression testing for quantized models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DawnofGenX" }]
keywords = ["quantization", "regression-testing", "evaluation", "ci", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quant-regress = "quant_regress.cli:main"

[project.urls]
Homepage = "https://github.com/DawnofGenX/quant-regress"
Issues = "https://github.com/DawnofGenX/quant-regress/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
